<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ganha Real</title>

<!-- SDK AdsGram -->
<script src="https://adsgram.ai/sdk.js"></script>

<style>
body {
    font-family: Arial;
    text-align: center;
    padding: 40px;
    background: #111;
    color: white;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #00c853;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #00e676;
}
</style>

</head>

<body>

<h2>💰 Ganha Real</h2>
<p>Assista o anúncio completo e ganhe recompensa</p>

<button onclick="assistir()">🎬 Assistir anúncio</button>

<p id="status"></p>

<script>
function assistir() {
    const status = document.getElementById("status");

    if (typeof Adsgram === "undefined") {
        status.innerText = "SDK não carregou ainda...";
        return;
    }

    status.innerText = "Carregando anúncio...";

    Adsgram.init({
        blockId: "bot-28969"
    });

    Adsgram.show()
    .then(() => {
        status.innerText = "Anúncio concluído!";

        setTimeout(() => {
            window.location.href = "https://t.me/watchamanda_bot?start=REWARD";
        }, 1000);
    })
    .catch((err) => {
        status.innerText = "Sem anúncio disponível agora.";
        console.log(err);
    });
}
</script>

</body>
</html>
