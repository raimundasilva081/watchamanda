<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ganha Real</title>

<!-- SDK AdsGram -->
<script src="https://adsgram.ai/sdk.js"></script>

<style>
body {
    font-family: Arial;
    text-align: center;
    padding: 40px;
    background: #111;
    color: white;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #00c853;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #00e676;
}
</style>

</head>

<body>

<h2>💰 Ganha Real</h2>
<p>Assista o anúncio completo e ganhe recompensa</p>

<button onclick="assistir()">🎬 Assistir anúncio</button>

<p id="status"></p>

<script>
function assistir() {
    document.getElementById("status").innerText = "Carregando anúncio...";

    try {
        // AdsGram rewarded
        Adsgram.init({
            blockId: "SEU_BLOCK_ID_AQUI"
        });

        Adsgram.show()
        .then(() => {
            document.getElementById("status").innerText = "Anúncio concluído!";

            // manda reward pro bot
            setTimeout(() => {
                window.location.href = "https://t.me/SEU_BOT?start=REWARD";
            }, 1000);
        })
        .catch(() => {
            document.getElementById("status").innerText = "Erro ao carregar anúncio.";
        });

    } catch (e) {
        document.getElementById("status").innerText = "Erro no sistema.";
    }
}
</script>

</body>
</html>
