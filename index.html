<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ganha Real</title>

<script src="https://adsgram.ai/sdk.js"></script>

<style>
body {
    font-family: Arial;
    text-align: center;
    padding: 40px;
    background: #111;
    color: white;
}
button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #00c853;
    color: white;
}
</style>

</head>

<body>

<h2>💰 Ganha Real</h2>
<p>Assista o anúncio completo e ganhe recompensa</p>

<button onclick="assistir()">🎬 Assistir anúncio</button>

<p id="status"></p>

<script>
function getUserId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("userId");
}

function assistir() {
    const status = document.getElementById("status");

    try {
        if (!window.Adsgram) {
            status.innerText = "Carregando sistema...";
            return;
        }

        status.innerText = "Carregando anúncio...";

        Adsgram.init({
            blockId: "bot-28969"
        });

        Adsgram.show()
        .then(() => {
            status.innerText = "Anúncio concluído!";

            const userId = getUserId();

            setTimeout(() => {
                window.location.href = `https://t.me/watchamanda_bot?start=REWARD_${userId}`;
            }, 1000);
        })
        .catch(() => {
            status.innerText = "Sem anúncio disponível agora.";
        });

    } catch (e) {
        status.innerText = "Erro interno, tente novamente.";
        console.log(e);
    }
}
</script>

</body>
</html>
